# =========================================
# Banco de Dados MySQL
# Credenciais lidas de variáveis de ambiente
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================
# JWT
# =========================================
jwt.secret=${JWT_SECRET:segredo-padrao-apenas-para-dev-troque-em-producao}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# =========================================
# Administrador inicial
# =========================================
admin.email=${ADMIN_EMAIL:admin@biblioteca.edu.br}
admin.nome=${ADMIN_NOME:Administrador}
admin.senha=${ADMIN_SENHA:Admin@2026!}

# =========================================
# Servidor
# =========================================
server.port=8080
spring.application.name=biblioteca-backend

# UTF-8 em todas as respostas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# =========================================
# Capas de Livros
# =========================================
app.capas.diretorio=${APP_CAPAS_DIRETORIO:./uploads/capas}
app.capas.google-books-api-key=${GOOGLE_BOOKS_API_KEY:}


# =========================================
# Compressão HTTP (Brotli/Gzip nas respostas)
# O Vite gera bundles com hash no nome, então max-age longo é seguro para
# assets estáticos. O index.html nunca tem hash — não recebe cache longo.
# =========================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,text/xml
server.compression.min-response-size=1024

# =========================================
# Cache de assets estáticos
# Vite gera nomes com hash (ex: index-abc123.js) — immutable é seguro aqui.
# =========================================
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
